[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itg-surrogate"
version = "0.1.0"
description = "JAX/Flax periodic 1D CNN surrogates for nonlinear stellarator ITG gyrokinetic heat flux with out-of-distribution stellarator-grouped evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "flax>=0.8.0",
    "h5py>=3.10.0",
    "jax>=0.4.30",
    "numpy>=1.26.0",
    "optax>=0.2.2",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
baselines = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "ruff>=0.7.0",
]

[project.scripts]
itg-surrogate = "itg_surrogate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
