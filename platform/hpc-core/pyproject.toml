[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-hpc-core"
version = "0.2.0"
description = "TACC-safe core primitives (Slurm wrappers, SchedulerBackend protocol, state, HTTPS client, outbox, notify, dataset manifest). Zero AI/Cloud SDK dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hpc_core*"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]
