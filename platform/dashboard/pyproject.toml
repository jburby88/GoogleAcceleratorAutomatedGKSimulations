[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-kr2-dashboard"
version = "0.2.0"
description = "Streamlit telemetry & operational audit dashboard (Cloud Run Direct IAP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  # >=1.51: st.plotly_chart / st.dataframe width="stretch" (use_container_width is deprecated).
  "streamlit>=1.51,<2",
  "duckdb>=1.1.0,<3",
  "pandas>=2.2.0,<4",
  "plotly>=5.24.0,<8",
  "google-cloud-bigquery>=3.25.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.setuptools]
py-modules = ["theme", "db", "streamlit_app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
