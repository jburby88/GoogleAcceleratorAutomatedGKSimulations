[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-aurora-steer"
version = "0.3.0"
description = "Shared Cloud Run LLM steering & telemetry service for UT Austin x Google.org AI for Science"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Upper bounds stop a new major release from silently changing production behaviour
# at the next image build. A hash-pinned lock file is generated in CI (needs network).
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "google-adk>=2.0.0,<3.0",
  "google-genai>=1.10.0,<3.0",
  "pyyaml>=6.0.1,<7.0",
  "duckdb>=1.1.0,<3.0",
  "google-auth>=2.28.0,<3.0",
  # Needed by google.auth.transport.requests (BigQuery token refresh in app/events.py).
  "requests>=2.31.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0",
  "httpx>=0.27.0,<1.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
