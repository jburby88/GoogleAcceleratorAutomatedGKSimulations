[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-kr2-tacc-exec"
version = "0.2.0"
description = "TACC-safe (Zero AI / Zero Cloud SDK) gyrokinetic simulation patchers, watchdog, and queue driver"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "ut-hpc-core",
  "f90nml>=1.4.4",
  "tomlkit>=0.13.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[project.scripts]
tacc-driver = "tacc_exec.driver:main"
tacc-watchdog = "tacc_exec.watchdog:main"
tacc-preflight = "tacc_exec.preflight:main"
tacc-resolve = "tacc_exec.resolve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tacc_exec*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
