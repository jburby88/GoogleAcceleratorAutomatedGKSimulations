# Keeps SHA-pinned GitHub Actions, base images and Python dependency bounds current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /platform/aurora-steer
      - /platform/dashboard
      - /simulations/gcp
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories:
      - /platform/aurora-steer
      - /platform/dashboard
      - /platform/hpc-core
      - /simulations/hpc
      - /simulations/gcp
      - /surrogates
    schedule:
      interval: weekly
