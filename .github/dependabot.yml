# Keeps SHA-pinned GitHub Actions, base images and Python dependency bounds current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /platform/aurora-steer
      - /platform/dashboard
      - /workstreams/kr2-gk-database/gcp
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories:
      - /platform/aurora-steer
      - /platform/dashboard
      - /platform/hpc-core
      - /workstreams/kr2-gk-database/hpc
      - /workstreams/kr2-gk-database/gcp
      - /workstreams/kr1-optimizer-orchestration
      - /workstreams/kr3-transport-consistent-design
    schedule:
      interval: weekly
