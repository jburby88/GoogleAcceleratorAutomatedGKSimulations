name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same make targets a developer runs locally (single source of truth).
jobs:
  tacc-zero-ai-gate:
    name: TACC dependency allowlist & boundaries (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build .venv-tacc and verify dependencies (make install-tacc)
        run: make install-tacc PYTHON=python

  lint-and-test:
    name: Lint, unit, contract & dual-backend E2E tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [tacc-zero-ai-gate]
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = requires-python floor, 3.12 = container runtime, 3.13 = developer workstations
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace packages (make install)
        run: make install PYTHON=python
      - name: Lint (make lint)
        run: make lint
      - name: Test (make test)
        run: make test

  infra-lint:
    name: Terraform, shell, Dockerfile & workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
      - name: Lint infrastructure (make lint-infra)
        env:
          STRICT_TOOLS: "1"
          HADOLINT: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint
          ACTIONLINT: docker run --rm -v ${{ github.workspace }}:/repo --workdir /repo rhysd/actionlint:1.7.7
        run: make lint-infra
