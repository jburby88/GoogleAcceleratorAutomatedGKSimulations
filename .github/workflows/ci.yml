name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same make targets a developer runs locally (single source of truth).
jobs:
  tacc-zero-ai-gate:
    name: TACC zero-AI allowlist & boundaries (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build .venv-tacc and run the allowlist gate (make install-tacc)
        run: make install-tacc PYTHON=python

  lint-and-test:
    name: Lint, unit, contract & dual-backend E2E tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [tacc-zero-ai-gate]
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = requires-python floor, 3.12 = container runtime, 3.13 = developer workstations
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace packages (make install)
        run: make install PYTHON=python
      - name: Lint (make lint)
        run: make lint
      - name: Test (make test)
        run: make test

  infra-lint:
    name: Terraform, shell, Dockerfile & workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
      - name: Lint infrastructure (make lint-infra)
        env:
          STRICT_TOOLS: "1"
          HADOLINT: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint
          ACTIONLINT: docker run --rm -v ${{ github.workspace }}:/repo --workdir /repo rhysd/actionlint:1.7.7
        run: make lint-infra
