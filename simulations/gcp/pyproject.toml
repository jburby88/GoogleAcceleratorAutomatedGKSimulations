[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-kr2-gcp-exec"
version = "0.2.0"
description = "GCP Cloud Batch GX execution backend (Spot L4 default / Spot A100 fallback) + serverless babysitter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "ut-hpc-core",
  "ut-kr2-tacc-exec",
  "requests>=2.31.0",
]

[project.optional-dependencies]
nc = [
  "netCDF4>=1.6.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[project.scripts]
gcp-gx-babysitter = "gcp_exec.runner:main"
gx-diagnose = "gcp_exec.gx_diagnostics:main"
gx-task = "gcp_exec.task_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gcp_exec*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
