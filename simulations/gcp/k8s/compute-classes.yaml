# GKE custom compute classes (cloud.google.com/v1 ComputeClass) for GX runs.
#   Schema:   https://cloud.google.com/kubernetes-engine/docs/reference/crds/computeclass
#   Concepts: https://cloud.google.com/kubernetes-engine/docs/concepts/about-custom-compute-classes
# Apply to a GKE Autopilot or Standard cluster:
#   kubectl apply -f simulations/gcp/k8s/compute-classes.yaml
#
# Spend policy (GCP-04): the default classes gx-gpu-obtainable, gx-gpu-l4-or-a100, gx-gpu-highmem
# and gx-cpu are Spot-only, and whenUnsatisfiable: DoNotScaleUp leaves a Pod Pending instead of
# falling back to the cluster's default on-demand machine series (what ScaleUpAnyway does).
# On-demand and DWS flex-start capacity exist only in the opt-in "<name>-ondemand" classes, which
# gke_backend selects only when the config sets allow_on_demand=true.
#
# GPU drivers: driverVersion: latest (needs GKE >= 1.31.1-gke.1858000) installs the R570+ branch on
# GKE 1.31+, which runs the CUDA 12.6 image natively. "default" is R535 on GKE 1.28-1.33 and would
# rely on CUDA minor-version compatibility; the image ships SASS for sm_75/sm_80/sm_89 so that
# still works, but PTX JIT would not. https://cloud.google.com/kubernetes-engine/docs/how-to/gpus
#
# Rule notes:
# - flexStart rules carry no spot field: flex-start and Spot are separate provisioning models.
# - nodePoolAutoCreation on a Standard cluster needs node auto-provisioning, or GKE 1.33.3+.
# - activeMigration.optimizeRulePriority is intentionally omitted so GKE never evicts an in-flight
#   GX run to move it to a higher-priority node.
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-gpu-obtainable
  labels:
    workstream: kr2-gk-database
    provisioning: spot-only
  annotations:
    cloud.google.com/description: >
      Default Spot-only GPU waterfall for standard GX runs (<= 13.5 GB VRAM):
      Spot L4 -> Spot T4 -> Spot A100. Pods stay Pending when no Spot capacity exists.
spec:
  priorities:
    # Spot NVIDIA L4 (24 GB VRAM, g2): best price/performance
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: true
    # Spot NVIDIA T4 (16 GB VRAM, n1): deepest GPU pool
    - machineFamily: n1
      gpu:
        type: nvidia-tesla-t4
        count: 1
        driverVersion: latest
      spot: true
    # Spot NVIDIA A100 40 GB (a2)
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-gpu-obtainable-ondemand
  labels:
    workstream: kr2-gk-database
    provisioning: on-demand-opt-in
  annotations:
    cloud.google.com/description: >
      Opt-in (allow_on_demand=true) waterfall for standard GX runs: Spot L4 -> Spot T4 ->
      DWS flex-start L4 -> on-demand L4 -> Spot A100.
spec:
  priorities:
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: true
    - machineFamily: n1
      gpu:
        type: nvidia-tesla-t4
        count: 1
        driverVersion: latest
      spot: true
    # Dynamic Workload Scheduler flex-start L4 (queued provisioning, on-demand price tier)
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      flexStart:
        enabled: true
    # On-demand NVIDIA L4
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: false
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-gpu-l4-or-a100
  labels:
    workstream: kr2-gk-database
    provisioning: spot-only
  annotations:
    cloud.google.com/description: >
      Default Spot-only waterfall for medium-VRAM GX runs (13.5 GB < VRAM <= 20 GB). Excludes
      the 16 GB T4 to avoid CUDA OOM: Spot L4 -> Spot A100.
spec:
  priorities:
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: true
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-gpu-l4-or-a100-ondemand
  labels:
    workstream: kr2-gk-database
    provisioning: on-demand-opt-in
  annotations:
    cloud.google.com/description: >
      Opt-in (allow_on_demand=true) medium-VRAM waterfall: Spot L4 -> DWS flex-start L4 ->
      on-demand L4 -> Spot A100.
spec:
  priorities:
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: true
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      flexStart:
        enabled: true
    - machineFamily: g2
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: false
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-gpu-highmem
  labels:
    workstream: kr2-gk-database
    provisioning: spot-only
  annotations:
    cloud.google.com/description: >
      Default Spot-only class for high-VRAM GX runs (> 20 GB VRAM), e.g. refined grids or
      kinetic electrons after SPECTRAL_PILEUP / OUT_OF_MEMORY: Spot A100 40 GB only.
spec:
  priorities:
    # Spot NVIDIA A100 40 GB (a2-highgpu-1g)
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-gpu-highmem-ondemand
  labels:
    workstream: kr2-gk-database
    provisioning: on-demand-opt-in
  annotations:
    cloud.google.com/description: >
      Opt-in (allow_on_demand=true) high-VRAM waterfall: Spot A100 -> DWS flex-start A100 ->
      on-demand A100.
spec:
  priorities:
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: true
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      flexStart:
        enabled: true
    - machineFamily: a2
      gpu:
        type: nvidia-tesla-a100
        count: 1
        driverVersion: latest
      spot: false
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-cpu
  labels:
    workstream: kr2-gk-database
    provisioning: spot-only
  annotations:
    cloud.google.com/description: >
      Default Spot-only CPU class (e2) for test and validation runs in projects with no GPU
      quota. DoNotScaleUp: no silent fallback to on-demand nodes.
spec:
  priorities:
    - machineFamily: e2
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gx-cpu-ondemand
  labels:
    workstream: kr2-gk-database
    provisioning: on-demand-opt-in
  annotations:
    cloud.google.com/description: >
      Opt-in (allow_on_demand=true) CPU class: Spot e2 -> on-demand e2.
spec:
  priorities:
    - machineFamily: e2
      spot: true
    - machineFamily: e2
      spot: false
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
